$schema: 'https://raw.githubusercontent.com/context-hub/generator/refs/heads/main/json-schema.json'
documents:
  -
    description: 'VideoJSON Project Structure'
    outputPath: docs/project-structure.md
    overwrite: true
    sources:
      -
        type: tree
        description: 'Project Directory Structure'
        sourcePaths:
          - app
          - lib
          - shared
          - worker/src
          - prisma
        filePattern: '*'
        renderFormat: ascii
        enabled: true
        showCharCount: true
        maxDepth: 3
