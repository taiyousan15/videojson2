name: schema-validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Schemas and Narration consistency
        run: npm run validate

      - name: Test analyze:transcript (fixtures only, no network)
        run: |
          npm run analyze:transcript -- \
            --transcript examples/fixtures/transcript.sample.json \
            --out .tmp/structure.from-transcript.json
          node scripts/validate-json.mjs schemas/structure.schema.json .tmp/structure.from-transcript.json
