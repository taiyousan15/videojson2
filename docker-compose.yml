services:
  postgres:
    image: postgres:16-alpine
    container_name: videojson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videojson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videojson}
      POSTGRES_DB: ${POSTGRES_DB:-videojson}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videojson}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
